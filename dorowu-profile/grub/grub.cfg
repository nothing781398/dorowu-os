# Dorowu OS Live GRUB Configuration
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod font

set default="dorowu-os"
set timeout=15

menuentry "Dorowu OS (x86_64, UEFI)" --class arch --class gnu-linux --class gnu --class os --id 'dorowu-os' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=n
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/amd-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "Dorowu OS (x86_64, UEFI, Safe Graphics / nomodeset)" --class arch --class gnu-linux --class gnu --class os --id 'dorowu-os-safe' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% nomodeset cow_spacesize=10G copytoram=n
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/amd-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "Dorowu OS (x86_64, Copy to RAM)" --class arch --class gnu-linux --class gnu --class os --id 'dorowu-os-ram' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=y
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/amd-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

if [ -f '/%INSTALL_DIR%/boot/memtest86+/memtest.efi' ]; then
    menuentry "Run Memtest86+ (RAM Diagnostics)" --class memtest --id 'memtest' {
        chainloader /%INSTALL_DIR%/boot/memtest86+/memtest.efi
    }
fi

menuentry "UEFI Firmware Settings" --id 'uefi-firmware' {
    fwsetup
}

menuentry "Reboot System" --id 'reboot' {
    reboot
}

menuentry "Power Off System" --id 'poweroff' {
    halt
}
