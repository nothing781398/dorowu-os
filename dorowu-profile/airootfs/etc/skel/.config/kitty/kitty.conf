# Dorowu OS Kitty Terminal Configuration
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
font_size        11.5

background_opacity 0.85
dynamic_background_opacity yes
allow_remote_control no

scrollback_lines 10000
cursor_shape beam
cursor_blink_interval 0.5

