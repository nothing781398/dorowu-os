# Dorowu OS User Setup Security Policy
# - Live session may be convenience-only.
# - Installed system must require a user-selected password.
# - Root must not be a public default.
# - sudo must ask for a password.

# Example for Calamares users.conf
# passwordRequirements:
#   minLength: 8
#   require_uppercase: true
#   require_lowercase: true
#   require_numbers: true
#   require_symbols: false
#   blacklist_file: /etc/shadow
#
# autologin: false
# sudoersRule: "%wheel ALL=(ALL:ALL) ALL"
#
# The installed system should never ship with a known root or shared password.
